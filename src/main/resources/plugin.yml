  megacrossbow:
    description: Get a powerful crossbow
    usage: /<command> [player]
    permission: megatools.megacrossbow
    permission-message: "&cYou don't have permission to use this command"
  megafns:
    description: Get a flint and steel
    usage: /<command> [player]
    permission: megatools.megafns
    permission-message: "&cYou don't have permission to use this command"
  megashears:
    description: Get a shears
    usage: /<command> [player]

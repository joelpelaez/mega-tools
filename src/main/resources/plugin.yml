name: MegaTools
main: com.joemaxsolutions.mc.megatools.MegaTools
version: 1.4.0-SNAPSHOT
description: Super powered tools provider
author: Joe Max Solutions
api-version: '26.1.2'

commands:
  megasword:
    description: Get a powerful sword
    usage: /<command> [player] [fire|nofire]
    permission: megatools.megasword
    permission-message: "&cYou don't have permission to use this command"
  megaaxe:
    description: Get a powerful axe
    usage: /<command> [player] [fortune|silk]
    permission: megatools.megaaxe
    permission-message: "&cYou don't have permission to use this command"
  megapickaxe:
    description: Get a powerful pickaxe
    usage: /<command> [player] [fortune|silk]
